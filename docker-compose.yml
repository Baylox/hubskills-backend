services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hubskills
      POSTGRES_USER: hubskills
      POSTGRES_PASSWORD: hubskills
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubskills"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hubskills
      DB_USERNAME: hubskills
      DB_PASSWORD: hubskills
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
